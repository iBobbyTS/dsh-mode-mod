# dsh-mode-mod bundle patch, layer 1 of 3: the plugin row itself, plus an
# id-targeted ptc-runtime config override.
#
# The host half (src/index.ts) injects the seven development-goal
# system-prompt texts as one scoped prompt section per top-level agent
# (session > project > global tier resolution; global tier = defaultGoal
# below), injects the run_code guidance on PTC-presenting agents, and serves
# the /api/mode-mod/* routes; the browser half (./client) seats the goal
# picker and project-default action beside the preset (mode) picker. The
# Creator-mode preset-cordis override lives in the second layer,
# presets/creator-cordis.patch.yml, and the browser-only 资料搜索 preset in
# the third, presets/web-research.patch.yml — each overlay file must be a
# single YAML document (a multi-document stream fails to parse and the whole
# bundle is skipped).
- insert:
    - id: mode-mod
      name: '@local/dsh-mode-mod'
      config:
        defaultGoal: prototype

# run_code (PTC) default and maximum timeout: one day. The base
# bundle carries the ptc-runtime row with no config; this id-targeted override
# supplies config wholesale (never deep-merged), and the runtime's Config
# schema defaults fill the remaining fields. Both default and maximum are one day;
# nested tool deadlines remain independent.
- id: ptc-runtime
  name: '@deepseek-ai/dsh-ptc-runtime-node'
  config:
    timeoutMs: 86400000
    maxTimeoutMs: 86400000
